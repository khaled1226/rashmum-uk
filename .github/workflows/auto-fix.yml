name: Auto-Fix & Health Check

on:
  schedule:
    # Every 6 hours — automated checks keep the repo healthy 24/7.
    - cron: "0 */6 * * *"
  workflow_dispatch:

jobs:
  health-check:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check
        run: bun tsc -b --noEmit
        continue-on-error: true
        id: typecheck

      - name: Build check
        run: bun vite build
        continue-on-error: true
        id: build

      - name: Open issue on failure
        if: steps.typecheck.outcome == 'failure' || steps.build.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const title = "🤖 Auto-fix needed: build or typecheck failing";
            const body = `The scheduled health check found problems.\n\n- Typecheck: **${{ steps.typecheck.outcome }}**\n- Build: **${{ steps.build.outcome }}**\n\nRun: [action run](${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID})`;
            const issues = await github.rest.issues.listForRepo({ owner: context.repo.owner, repo: context.repo.repo, state: "open", per_page: 100 });
            const existing = issues.data.find((i) => i.title === title);
            if (existing) {
              await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: existing.number, body });
            } else {
              await github.rest.issues.create({ owner: context.repo.owner, repo: context.repo.repo, title, body, labels: ["automated", "bug"] });
            }

      - name: Ping production (warm-up + uptime data point)
        if: env.SITE_URL != ''
        run: curl -fsS --max-time 15 "$SITE_URL" > /dev/null && echo "Site responded OK" || echo "::warning::Site did not respond"
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
